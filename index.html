<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trung tâm Học tập APSP • Ứng dụng tình huống: Năng lực Bổ trợ - Ra quyết định</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --ink:#0b1220; --muted:#5b6b7c; --line:#e6eef0;
      --g1:#22d3ee; --g2:#32bebb; --g3:#3bd2f0; --g4:#7dd3fc;
      --card:#ffffff;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0; font-family:Montserrat,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; color:var(--ink);
      background:
        radial-gradient(1200px 800px at -10% -10%, #f0fbff 0%, #ffffff 40%, #f7fbff 100%),
        linear-gradient(160deg,#eefbff 0%, #ffffff 50%, #f4fffd 100%);
    }
    .wrap{max-width:1100px; margin:0 auto; padding:16px 20px}

    /* TAB BAR */
    .tabbar{display:flex; gap:8px; flex-wrap:wrap; margin:0 0 14px}
    .tbtn{appearance:none; border:1px solid var(--line); background:#fff; border-radius:999px; padding:10px 12px; font-weight:800; cursor:pointer}
    .tbtn.active{background:linear-gradient(90deg,var(--g2),var(--g3)); color:#fff; border-color:transparent; box-shadow:0 10px 24px rgba(50,190,187,.25)}
    .tpanel{display:none}
    .tpanel.active{display:block}

    /* CARDS */
    .card{background:var(--card); border:1px solid var(--line); border-radius:22px; box-shadow:0 16px 40px rgba(13,110,139,.08); overflow:hidden}
    .pad{padding:18px 20px}

    /* TYPO */
    .h1{font-size:38px; line-height:1.15; margin:6px 0 10px; font-weight:800; background:linear-gradient(90deg,var(--g1),var(--g2),var(--g3)); -webkit-background-clip:text; color:transparent; text-transform:uppercase}
    .lead{color:#3d5360; font-size:16px}
    .muted{color:var(--muted); font-size:13px}

    /* BUTTONS */
    .btn-lg{appearance:none; border:0; border-radius:14px; padding:14px 18px; font-weight:800; cursor:pointer; color:#ffffff; text-decoration:none; display:inline-block; background:linear-gradient(90deg,var(--g2),var(--g3)); box-shadow:0 10px 24px rgba(50,190,187,.35)}
    .btn-ghost{appearance:none; border:1px solid rgba(3,52,59,.15); background:rgba(255,255,255,.85); color:#063a41; border-radius:14px; padding:12px 16px; font-weight:800}
    .actions{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
    .tag{display:inline-block; background:rgba(2,60,91,.08); color:#063a41; padding:4px 8px; border-radius:999px; font-weight:800; font-size:12px}

    /* FORM */
    form{display:grid; gap:14px}
    .row{display:grid; gap:12px; grid-template-columns:1fr 1fr}
    @media (max-width:700px){ .row{grid-template-columns:1fr} }
    .field{display:grid; gap:6px}
    .field label{font-weight:700; font-size:14px}
    input[type="text"], input[type="email"], select{width:100%; border:1px solid var(--line); border-radius:12px; padding:12px 14px; font:inherit; background:#fff; outline:none; transition:.2s border, .2s box-shadow}
    input:focus, select:focus{border-color:#8ee3df; box-shadow:0 0 0 4px rgba(50,190,187,.18)}

    /* CHOICES */
    .choices{display:grid; grid-template-columns:1fr; gap:12px}
    .choice{display:flex; gap:12px; border:1px solid #e6eef0; padding:14px; border-radius:16px; cursor:pointer; transition:transform .15s ease, box-shadow .15s ease}
    .choice:hover{transform:translateY(-2px); box-shadow:0 14px 28px rgba(50,190,187,.16)}
    .choice input{accent-color:#0ea5a4; transform:scale(1.2)}

    .toast{position:fixed; bottom:16px; right:16px; background:linear-gradient(120deg,#03343b,#09515e); color:#e6fffb; padding:12px 14px; border-radius:12px; box-shadow:0 12px 22px rgba(2,60,91,.24); display:none; z-index:80}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card pad" id="tabs">
      <div class="tabbar" id="tabbar" role="tablist">
        <button class="tbtn active" data-tab="home" role="tab" aria-selected="true">Trang chủ</button>
        <button class="tbtn" data-tab="info" role="tab" aria-selected="false">Thông tin</button>
        <!-- Tabs Tình huống 1..5 + Nộp bài sẽ sinh tự động -->
      </div>

      <!-- Tab 1: Trang chủ -->
      <div class="tpanel active" id="home" role="tabpanel">
        <div class="h1">Trung tâm Học tập APSP</div>
        <h2>Ứng dụng tình huống: Năng lực Bổ trợ – Ra quyết định</h2>
        <p class="lead">Làm lần lượt 5 tình huống, sau đó xác nhận nộp bài. Dữ liệu sẽ đồng bộ về trung tâm đào tạo.</p>
